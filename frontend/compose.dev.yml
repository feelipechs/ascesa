services:
  db-dev:
    image: docker.io/library/postgres:17-alpine
    container_name: ong_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ong_user
      POSTGRES_PASSWORD: ong_dev_pass
      POSTGRES_DB: ong_dev
    ports:
      - '5432:5432'
    volumes:
      - ong_pgdata_dev:/var/lib/postgresql/data

volumes:
  ong_pgdata_dev:
